# Profile
profile:
  title: مدیر فناوری اطلاعات | مدیر سیستم | مهندس برق
  details: >-
    مدیر فناوری اطلاعات، مدیر سیستم و مهندس برق با سابقه در اتوماسیون صنعتی، محاسبات کارایی بالا (HPC) و مدیریت زیرساخت. بیش از ۱۵ سال تجربه در مهندسی برق، نظارت بر پروژه، مدیریت نگهداری و راهکارهای فناوری اطلاعات در حوزه‌های انرژی، نفت و گاز و دانشگاه. مسلط به سیستم‌های Linux/BSD، DevOps، مدیریت بار کاری HPC و برنامه‌نویسی به زبان‌های Python و C. علاقه‌مند به فناوری‌های متن‌باز، اتوماسیون و حل مسائل فنی.

