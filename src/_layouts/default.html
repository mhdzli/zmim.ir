---
layout: compress
---
<!DOCTYPE html>
<html lang="{{ site.active_lang }}"{% if site.active_lang == 'fa' %} dir="rtl"{% endif %}>
{% include header.html %}

<body data-theme="{{ site.mode }}" class="notransition">

  <script>
    const body = document.body;
    const data = body.getAttribute("data-theme");

    const initTheme = (state) => {
      if (state === "dark") {
        body.setAttribute("data-theme", "dark");
      } else if (state === "light") {
        body.removeAttribute("data-theme");
      } else {
        localStorage.setItem("theme", data);
      }
    };

    initTheme(localStorage.getItem("theme"));

    const savedLang = localStorage.getItem("lang");
    if (savedLang) {
      const isEnglish = window.location.pathname.startsWith("/en");
      if (savedLang === "en" && !isEnglish) {
        window.location.replace("/en" + window.location.pathname);
      } else if (savedLang === "fa" && isEnglish) {
        window.location.replace(window.location.pathname.replace(/^\/en/, "") || "/");
      }
    }

    setTimeout(() => body.classList.remove("notransition"), 75);
  </script>

  {% include navbar.html %}
  <div class="wrapper">
    {% include author.html %}
    <main aria-label="Content">
      {{ content }}
    </main>
    {% include footer.html %}
  </div>
</body>
</html>
