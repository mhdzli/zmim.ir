---
title_fa: ویکی
title_en: Wiki
permalink: /wiki/
layout: page
excerpt: My cheat sheets.
---

{% assign t = site.data.locales[site.active_lang] %}
<h3 class="posts-item-note" aria-label="Cheat Sheets">
  {{ t.secret_notes }}
</h3>
{%- for post in site.wiki -%}
<article class="post-item">
  <span class="post-item-date">
  <i class="fa fa-calendar" style="color: #51d994;"></i>
  <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: t.date_format }}
    </span>
  <h4 class="post-item-title" style="padding-right: 8px;">
    <a href="{{ post.url }}">{{ post.title | escape }}</a>
  </h4>
</article>
{%- endfor -%}
